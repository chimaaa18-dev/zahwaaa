<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zahwa Denija Nerazurri</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--rose:#e84a82;--pink:#ffb6cf;--soft:#ffe4ee;--gold:#d4a24c;--deep:#7a1f48}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins',sans-serif;color:#fff;overflow-x:hidden;
background:linear-gradient(180deg,#ffd3e4 0%,#ff9fc2 38%,#f0709f 62%,#c94a7d 100%) fixed}
/* matahari & ombak */
.sun{position:fixed;top:8%;left:50%;width:180px;height:180px;margin-left:-90px;border-radius:50%;
background:radial-gradient(circle,#fff6d6,#ffd9a8 60%,transparent 72%);filter:blur(2px);opacity:.85;z-index:0}
.waves{position:fixed;left:0;bottom:0;width:100%;height:160px;z-index:0;pointer-events:none}
.waves svg{position:absolute;bottom:0;width:200%;height:100%;animation:wave 14s linear infinite}
.waves svg:nth-child(2){animation-duration:20s;animation-direction:reverse;opacity:.6;bottom:10px}
@keyframes wave{to{transform:translateX(-50%)}}
#petals{position:fixed;inset:0;pointer-events:none;z-index:1}
main{position:relative;z-index:2;min-height:100%;padding:48px 0 190px;text-align:center}
.crest{font-size:34px;letter-spacing:10px;color:var(--gold);text-shadow:0 2px 10px #0003}
h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(52px,11vw,104px);line-height:1.1;
text-shadow:0 4px 18px rgba(122,31,72,.45)}
.sub{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(15px,2.6vw,22px);opacity:.95;margin-top:6px}
.line{width:180px;height:2px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.name{font-family:'Playfair Display',serif;font-size:clamp(22px,4vw,34px);margin-top:14px;letter-spacing:3px;color:#fff7e0}
.dates{font-size:14px;letter-spacing:4px;opacity:.9;margin-top:4px}
/* slider */
.stage{position:relative;margin:34px auto 0;max-width:1100px}
.track{display:flex;gap:26px;overflow-x:auto;scroll-snap-type:x mandatory;padding:30px 50vw 40px;
scrollbar-width:none;scroll-behavior:smooth;cursor:grab}
.track::-webkit-scrollbar{display:none}
.track.drag{cursor:grabbing;scroll-behavior:auto;scroll-snap-type:none}
.frame{flex:0 0 auto;width:min(72vw,300px);scroll-snap-align:center;position:relative;padding:14px 14px 52px;
background:linear-gradient(145deg,#fff,#fff0f6);border-radius:6px;color:var(--deep);
border:3px solid var(--gold);outline:2px solid #fff;outline-offset:-9px;
box-shadow:0 18px 40px rgba(122,31,72,.45),inset 0 0 0 1px #f3d9a0;
transform:scale(.88) rotate(var(--r));opacity:.75;transition:transform .45s,opacity .45s}
.frame.active{transform:scale(1.04) rotate(0);opacity:1}
.frame .ph{aspect-ratio:3/4;border-radius:3px;overflow:hidden;background:linear-gradient(160deg,#ffd0e1,#ff9ec0);
display:flex;align-items:center;justify-content:center;font-size:64px;position:relative}
.frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.frame .cap{position:absolute;left:0;right:0;bottom:14px;font-family:'Great Vibes',cursive;font-size:25px}
.frame .no{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--rose);color:#fff;
font-size:12px;padding:3px 14px;border-radius:20px;border:2px solid var(--gold);letter-spacing:2px}
.frame .rose{position:absolute;font-size:30px;filter:drop-shadow(0 3px 4px #0004)}
.frame .rose.a{top:-18px;left:-16px}.frame .rose.b{bottom:-14px;right:-14px;transform:rotate(30deg)}
.btn{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;
border:2px solid var(--gold);background:rgba(255,255,255,.85);color:var(--rose);font-size:26px;cursor:pointer;z-index:5;
box-shadow:0 6px 18px #0003;transition:.25s}
.btn:hover{background:var(--rose);color:#fff}
.prev{left:10px}.next{right:10px}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px;padding:0 20px}
.dots i{width:9px;height:9px;border-radius:50%;background:#fff8;cursor:pointer;transition:.3s}
.dots i.on{background:var(--gold);transform:scale(1.5)}
.counter{margin-top:14px;letter-spacing:3px;font-size:13px}
.quote{max-width:640px;margin:34px auto 0;padding:0 24px;font-family:'Playfair Display',serif;font-style:italic;
font-size:clamp(16px,2.6vw,21px);line-height:1.7;text-shadow:0 2px 8px #0003}
.footer{margin-top:20px;font-family:'Great Vibes',cursive;font-size:30px;color:#fff7e0}
</style>
</head>
<body>
<div class="sun"></div>
<canvas id="petals"></canvas>
<div class="waves">
<svg viewBox="0 0 1200 160" preserveAspectRatio="none"><path fill="#fff" fill-opacity=".55" d="M0 70 Q150 20 300 70 T600 70 T900 70 T1200 70 V160 H0Z"/></svg>
<svg viewBox="0 0 1200 160" preserveAspectRatio="none"><path fill="#ffe4ee" d="M0 90 Q150 40 300 90 T600 90 T900 90 T1200 90 V160 H0Z"/></svg>
</div>

<main>
<div class="crest">❀ ✦ ❀</div>
<h1>Untukmu, Sayang</h1>
<p class="sub">Namamu akan abadi di dalam karyaku</p>
<div class="line"></div>
<div class="name" id="nama"></div>
<div class="dates" id="tanggal"></div>

<section class="stage">
<button class="btn prev" id="prev" aria-label="Sebelumnya">‹</button>
<button class="btn next" id="next" aria-label="Berikutnya">›</button>
<div class="track" id="track"></div>
<div class="dots" id="dots"></div>
<div class="counter" id="counter"></div>
</section>

<p class="quote" id="kutipan"></p>
<div class="footer">Penuh cinta, Chimaaa 🌹</div>
</main>

<script>
/* ====== EDIT BAGIAN INI SAJA ====== */
const NAMA   = "Zahwa Denija Nerazurri";
const TANGGAL = "2025 — 2026";
const KUTIPAN = "Zahwa Denija Nerazurri, yaa kamuu, kamu akan tetap jadi orang yang ingin aku lihat untuk menang"
/* Isi 15 foto di sini (nama file/URL). Kosongkan "" untuk bingkai hiasan. */
const FOTO = [
 {src:"foto/10.jpeg", cap:"Kenangan 1"},{src:"foto/2.jpeg", cap:"Kenangan 2"},{src:"foto/3.jpeg", cap:"Kenangan 3"},
 {src:"foto/4.jpeg", cap:"Kenangan 4"},{src:"foto/5.jpeg", cap:"Kenangan 5"},{src:"foto/6.jpeg", cap:"Kenangan 6"},
 {src:"foto/7.jpeg", cap:"Kenangan 7"},{src:"foto/8.jpeg", cap:"Kenangan 8"},{src:"foto/9.jpeg", cap:"Kenangan 9"},
 {src:"foto/1.jpeg", cap:"Kenangan 10"},{src:"foto/11.jpeg", cap:"Kenangan 11"},{src:"foto/12.jpeg", cap:"Kenangan 12"},
 {src:"foto/13.jpeg", cap:"Kenangan 13"},{src:"foto/14.jpeg", cap:"Kenangan 14"},{src:"foto/15.jpeg", cap:"Kenangan 15"}
];
/* =================================== */

document.getElementById('nama').textContent = NAMA;
document.getElementById('tanggal').textContent = TANGGAL;
document.getElementById('kutipan').textContent = "“" + KUTIPAN + "”";

const track = document.getElementById('track'), dots = document.getElementById('dots');
const counter = document.getElementById('counter');
const icons = ["🌹","🐚","🌸","🌊","🥀","🏝️","🌺","💗"];
const total = FOTO.length;

FOTO.forEach((f,i)=>{
  const d = document.createElement('div');
  d.className = 'frame';
  d.style.setProperty('--r', ((i%2?1:-1)*(1+i%3))+'deg');
  const inner = f.src ? `<img src="${f.src}" alt="${f.cap}" draggable="false">` : icons[i%icons.length];
  d.innerHTML = `<span class="no">${String(i+1).padStart(2,'0')}</span><span class="rose a">🌹</span><span class="rose b">🌹</span>
  <div class="ph">${inner}</div><div class="cap">${f.cap}</div>`;
  track.appendChild(d);
  const dot = document.createElement('i');
  dot.onclick = ()=>go(i);
  dots.appendChild(dot);
});

const frames = [...track.children], dotEls = [...dots.children];
let cur = 0;

function center(i){
  const f = frames[i];
  return f.offsetLeft - (track.clientWidth - f.clientWidth)/2;
}
function go(i){
  cur = (i+total)%total;
  track.scrollTo({left:center(cur), behavior:'smooth'});
}
function mark(){
  let best = 0, min = 1e9;
  const mid = track.scrollLeft + track.clientWidth/2;
  frames.forEach((f,i)=>{
    const dist = Math.abs(f.offsetLeft + f.clientWidth/2 - mid);
    if(dist<min){min=dist;best=i}
  });
  cur = best;
  frames.forEach((f,i)=>f.classList.toggle('active',i===best));
  dotEls.forEach((d,i)=>d.classList.toggle('on',i===best));
  counter.textContent = `${best+1} / ${total}`;
}
track.addEventListener('scroll',()=>requestAnimationFrame(mark));
document.getElementById('prev').onclick = ()=>go(cur-1);
document.getElementById('next').onclick = ()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(cur+1);
  if(e.key==='ArrowLeft')go(cur-1);
});

/* geser dengan mouse */
let down=false, sx=0, sl=0;
track.addEventListener('mousedown',e=>{down=true;sx=e.pageX;sl=track.scrollLeft;track.classList.add('drag')});
window.addEventListener('mouseup',()=>{
  if(!down)return; down=false; track.classList.remove('drag'); go(cur);
});
window.addEventListener('mousemove',e=>{
  if(!down)return; track.scrollLeft = sl-(e.pageX-sx);
});

window.addEventListener('load',()=>{go(0);setTimeout(mark,50)});
window.addEventListener('resize',()=>go(cur));

/* kelopak mawar jatuh */
const cv = document.getElementById('petals'), ctx = cv.getContext('2d');
let W,H;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
size(); addEventListener('resize',size);
const cols = ['#ff7aa8','#ff9fc2','#e84a82','#ffc2d6','#d4366f'];
const ps = Array.from({length:34},()=>({
  x:Math.random()*innerWidth,y:Math.random()*-innerHeight,s:6+Math.random()*10,
  v:.6+Math.random()*1.1,sw:Math.random()*Math.PI*2,r:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]
}));
function draw(){
  ctx.clearRect(0,0,W,H);
  ps.forEach(p=>{
    p.y+=p.v; p.sw+=.02; p.x+=Math.sin(p.sw)*.8; p.r+=.02;
    if(p.y>H+20){p.y=-20;p.x=Math.random()*W}
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.globalAlpha=.8;
    ctx.beginPath(); ctx.ellipse(0,0,p.s,p.s*.6,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
